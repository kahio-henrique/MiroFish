
services:
  mirofish:
    image: ghcr.io/666ghj/mirofish:latest
    container_name: mirofish
    env_file:
      - .env
    ports:
      - "3001:3000"
      - "5001:5001"
    restart: unless-stopped
    volumes:
      - mirofish_uploads:/app/backend/uploads
      - ./frontend/vite.config.js:/app/frontend/vite.config.js

volumes:
  mirofish_uploads:
